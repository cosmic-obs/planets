<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<script>
  // the page zooms itself (pinch on the chart or sky), so Safari's own pinch zoom of the whole page is turned off
  document.addEventListener('gesturestart', e => e.preventDefault());
</script>
<meta name="theme-color" content="#03060b">
<title>Planet Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: the sky fills the screen. A status line floats at the top, the picked planet's card appears under it, and the date and time sliders run along the bottom. */
:root {
  color-scheme: dark;
  --bg: #03060b;
  --panel: rgba(8, 14, 26, 0.82);
  --line: rgba(147, 160, 181, 0.24);
  --ink: #dfe6f0;
  --soft: #8e9bb0;
  --accent: #5fd0dc;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body {
  height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none;
  background: var(--bg); color: var(--ink); font: 400 14px/1.4 var(--font-ui);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
/* no double-tap zoom anywhere (taps and scrolling still work); the chart and the sky handle every gesture themselves */
* { touch-action: manipulation; }

#sky { position: fixed; inset: 0; touch-action: none; }
#sky canvas { display: block; }
.labels { position: absolute; inset: 0; pointer-events: none; }

.hud-top {
  position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; right: 12px;
  display: flex; align-items: center; gap: 8px; pointer-events: none;
}
.hud-top > * { pointer-events: auto; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px;
  font: 500 12px/1 var(--font-data); background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); cursor: pointer;
}
a.pill { color: inherit; text-decoration: none; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--soft); }
.pill[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--accent); }
.readout { margin-left: auto; color: var(--soft); cursor: default; font-variant-numeric: tabular-nums; }
.readout.nudged { color: var(--ink); cursor: pointer; }

.card {
  position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 60px); left: 12px; right: 12px;
  max-width: 420px; margin-inline: auto; padding: 12px 14px 13px; display: grid; gap: 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.card-top { display: flex; align-items: baseline; gap: 8px; }
.card-top b { font: 600 15px var(--font-data); color: var(--accent); }
.card-top span { flex: 1; min-width: 0; color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { background: none; border: 0; color: var(--soft); font-size: 22px; line-height: 1; padding: 0 2px; cursor: pointer; }
.card p { margin: 0; }
.card .soft { color: var(--soft); font-size: 13px; }
.chip {
  justify-self: start; margin-top: 6px; padding: 6px 12px; cursor: pointer;
  font: 500 12px var(--font-data); background: transparent; border: 1px solid var(--line); border-radius: 999px;
}

.hud-bottom {
  position: fixed; z-index: 2; left: 0; right: 0; bottom: 0;
  padding: 30px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(18px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, rgba(3, 6, 11, 0.95), rgba(3, 6, 11, 0.72) 65%, rgba(3, 6, 11, 0));
}
.sliders { max-width: 720px; margin: 0 auto; display: grid; }
.row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; min-height: 22px; }
.lbl { font: 500 13px var(--font-data); font-variant-numeric: tabular-nums; }
.state { margin-left: 8px; color: var(--soft); font: 400 12px var(--font-data); }
.row .chip { margin: 0; padding: 4px 11px; }
.track { position: relative; flex: 1; min-width: 0; }
.step { display: flex; align-items: center; gap: 4px; }
.step > input { flex: 1; min-width: 0; }
.arrow {
  flex: none; width: 34px; height: 36px; padding: 0; background: none; border: 0; border-radius: 8px; cursor: pointer;
  color: var(--soft); font: 500 20px/1 var(--font-data); touch-action: manipulation;
}
.arrow:hover, .arrow:active { color: var(--ink); background: rgba(147, 160, 181, 0.14); }
#spark { position: absolute; left: 0; bottom: 24px; width: 100%; height: 30px; pointer-events: none; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 36px; margin: 0; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--track, rgba(147, 160, 181, 0.3)); }
input[type="range"]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track, rgba(147, 160, 181, 0.3)); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; margin-top: -9px; border-radius: 50%;
  background: #e8edf5; border: 4px solid #0a1222; box-shadow: 0 0 0 1px rgba(147, 160, 181, 0.6);
}
input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #e8edf5; border: 4px solid #0a1222; }

.toast {
  position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 168px);
  width: max-content; max-width: min(90vw, 420px); margin: 0; padding: 10px 14px; text-align: center; font-size: 13px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
}
.hint {
  position: fixed; z-index: 1; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 160px);
  margin: 0; text-align: center; color: var(--soft); font: 400 12px var(--font-data); pointer-events: none; transition: opacity 1.2s;
}

/* labels drawn in the sky */
.m { margin-left: 10px; font: 500 10.5px var(--font-data); white-space: nowrap; }
.m.sel { margin-left: 15px; font-weight: 600; }
.m.below { opacity: 0.55; }
.star { margin-left: 7px; font: italic 400 11px var(--font-ui); color: rgba(223, 230, 240, 0.5); white-space: nowrap; }
.cardinal { font: 600 13px var(--font-data); color: rgba(142, 155, 176, 0.75); }
.hr { margin-left: 7px; font: 500 10px var(--font-data); color: rgba(223, 230, 240, 0.72); white-space: nowrap; }
.hr.best { color: var(--accent); }
.hr.below { opacity: 0.5; }
.sun { margin-left: 16px; font: 500 11px var(--font-data); color: rgba(255, 217, 138, 0.85); white-space: nowrap; }
.moon { margin-left: 14px; font: 500 11px var(--font-data); color: rgba(255, 240, 214, 0.8); white-space: nowrap; }
</style>
</head>
<body>
<div id="sky"></div>

<header class="hud-top">
  <a class="pill" id="back" href="./">‹ Calendar</a>
  <button type="button" class="pill" id="compass" aria-pressed="false" hidden><span class="dot" aria-hidden="true"></span><span id="compass-text">Compass</span></button>
  <button type="button" class="pill readout" id="pointing" aria-label="Where the view is pointing">S 180° · 30° up</button>
</header>

<section class="card" id="card" hidden aria-live="polite">
  <div class="card-top"><b id="card-id"></b><span id="card-name"></span><button type="button" class="x" id="card-close" aria-label="Close">×</button></div>
  <p id="card-now"></p>
  <p class="soft" id="card-best"></p>
  <button type="button" class="chip" id="card-go" hidden></button>
</section>

<p class="hint" id="hint"></p>
<p class="toast" id="toast" role="status" hidden></p>

<footer class="hud-bottom">
  <div class="sliders">
    <div class="row">
      <label class="lbl" for="date" id="date-label">Tonight</label>
      <button type="button" class="chip" id="now" hidden>Now</button>
    </div>
    <div class="step">
      <button type="button" class="arrow" data-step="night" data-by="-1" aria-label="Previous night">‹</button>
      <input type="range" id="date" min="0" max="365" step="1" value="182">
      <button type="button" class="arrow" data-step="night" data-by="1" aria-label="Next night">›</button>
    </div>
    <div class="row">
      <label class="lbl" for="time"><span id="time-label">22:00</span><span class="state" id="sky-state"></span></label>
    </div>
    <div class="step">
      <button type="button" class="arrow" data-step="minute" data-by="-1" aria-label="A minute earlier">‹</button>
      <div class="track">
        <canvas id="spark" hidden></canvas>
        <input type="range" id="time" min="0" max="1440" step="5" value="600">
      </div>
      <button type="button" class="arrow" data-step="minute" data-by="1" aria-label="A minute later">›</button>
    </div>
  </div>
</footer>

<script src="planets.js"></script>

} }
</script>

  [3, 0, 1363.2, 0], [3, 1, -2381.2, -82.1], [3, 2, 1236.2, 241.9], [3, 3, 525.7, -543.4],

  const ep = eclGeo.attributes.position, eps = (23.439 - 4e-7 * (jd - 2451545)) * D2R;
  for (let i = 0; i < ECL; i++) {
    const lam = i / ECL * 2 * Math.PI;
    const [alt, az] = altAz(mod(Math.atan2(Math.cos(eps) * Math.sin(lam), Math.cos(lam)) * R2D / 15, 24), Math.asin(Math.sin(eps) * Math.sin(lam)) * R2D, lst);
    P(alt, az, R * 1.01, tmpV);
    ep.setXYZ(i, tmpV.x, tmpV.y, tmpV.z);
  }
  ep.needsUpdate = true;
  ecliptic.material.opacity = 0.14 + 0.2 * d;

  const su = sunDot.geometry.attributes;
  const sp = P(sAlt, sAz, R * 0.99);
  su.position.setXYZ(0, sp.x, sp.y, sp.z);
  su.aColor.setXYZW(0, 1, 0.85, 0.54, sAlt > -1 ? 1 : 0);
  su.position.needsUpdate = su.aColor.needsUpdate = true;
  sunLbl.position.copy(sp);
  sunLbl.visible = sAlt > -1;

  const mo = moonPos(jd);
  let [mAlt, mAz] = altAz(mo.ra, mo.dec, lst);
  mAlt -= mo.par * Math.cos(mAlt * D2R); // seen from the ground, not Earth's centre
  moon.visible = mAlt > -1;
  P(mAlt, mAz, 97, moon.position);
  moonU.uSun.value.copy(skyU.uSun.value);
  const psi = Math.acos(clamp(Math.cos(mo.beta * D2R) * Math.cos((mo.lam - sun.lam) * D2R), -1, 1));
  moonLbl.element.textContent = `Moon ${Math.round((1 - Math.cos(psi)) / 2 * 100)}%`;

  css.domElement.style.opacity = String(0.45 + 0.55 * d);
  $('time-label').textContent = hhmm(ms);
  $('sky-state').textContent = SKY_PHRASE[skyIndex(sAlt)];
  $('date-label').textContent = nightName(state.noon);
  nowBtn.hidden = state.live;
  updateCard();
  dirty = true;
}

function updateCard() {
  const o = state.sel;
  card.hidden = !o;
  if (!o) return;
  const t = hhmm(instant()), b = state.best;
  $('card-id').textContent = o.id;
  $('card-name').textContent = `mag ≈${fmtMag(o.mag)} · ${Math.round(Math.abs(o.elong))}° ${o.elong > 0 ? 'east' : 'west'} of the Sun`;
  $('card-now').textContent = o.alt > 0 ? `${Math.round(o.alt)}° up in the ${compass(o.az)} at ${t}` : `Below the horizon at ${t}`;
  $('card-best').textContent = b
    ? `Best this night: ${Math.round(b.alt)}° in the ${compass(b.az)} at ${hhmm(b.ms)}${{ '-18': ', in full darkness', '-12': ', in twilight (no full darkness)', '-6': ', in bright twilight' }[b.thr]}.`
    : 'Not above the horizon while the sky is dark this night.';
  const go = $('card-go');
  go.hidden = !b;
  if (b) go.textContent = `Go to ${hhmm(b.ms)}`;
}
function select(o) {
  state.sel = o;
  buildPath();
  updateSky();
}

// ---------- looking around ----------
const view = { alt: 30, az: LAT >= 0 ? 180 : 0 }; // toward the equator, where most of the sky's traffic is
const fwd = new THREE.Vector3();
function applyView() {
  camera.up.set(0, 1, 0);
  camera.lookAt(P(view.alt, view.az, 1));
  dirty = true;
}
function viewFromCamera() {
  fwd.set(0, 0, -1).applyQuaternion(camera.quaternion);
  return { alt: Math.asin(clamp(fwd.y, -1, 1)) * R2D, az: mod(Math.atan2(fwd.x, -fwd.z) * R2D, 360) };
}

// device orientation, as in three.js's old DeviceOrientationControls
const sensor = { active: false, seen: false, abs: false, alpha: 0, beta: 90, gamma: 0, offC: null, offS: 0, noCompass: false };
let calib = 0;
try { calib = Number(localStorage.getItem('planet-sky-nudge')) || 0; } catch {}
const zee = new THREE.Vector3(0, 0, 1), eul = new THREE.Euler(), q0 = new THREE.Quaternion();
const q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2), qT = new THREE.Quaternion();
function deviceQuat(q, a, b, g, orient) {
  eul.set(b, a, -g, 'YXZ');
  q.setFromEuler(eul);
  q.multiply(q1);
  q.multiply(q0.setFromAxisAngle(zee, -orient));
}
// alpha measured from magnetic north; turning it to true north
function take(alpha, beta, gamma) {
  sensor.seen = true;
  sensor.alpha = alpha - DECLINATION;
  sensor.beta = beta;
  sensor.gamma = gamma;
}
function onAbsolute(e) {
  if (e.alpha == null) return;
  sensor.abs = true;
  sensor.noCompass = false;
  take(e.alpha, e.beta, e.gamma);
}
function onRelative(e) {
  if (e.alpha == null || sensor.abs) return;
  const h = e.webkitCompassHeading;
  if (typeof h === 'number' && h >= 0) {
    // iOS: alpha has an arbitrary zero, so tie it to the compass heading, smoothed
    // The heading is for the phone's top edge while it lies nearer flat and for its back while it stands nearer upright.
    // Tipped back past 45° above the horizon it is the top edge again, which by then points behind: the heading turns
    // half a circle though the phone hasn't. So a reading half a turn from the running offset is taken as that, and undone.
    let off = ((360 - h) - e.alpha) * D2R;
    // Standing upright the phone is at the gimbal lock of alpha and gamma: with the slightest roll the two trade
    // large, opposite swings as the back crosses the horizon. The heading doesn't swing with them, so alpha alone
    // would drag the offset left and right. Take out the angle between the top edge's bearing and the back's.
    const sb = Math.sin(e.beta * D2R), g = e.gamma * D2R;
    if (Math.abs(sb) > Math.SQRT1_2) off -= Math.atan2(Math.sin(g), Math.cos(g) * sb);
    if (sensor.offC == null) {
      if (Math.abs(e.beta) > 135) off += Math.PI;
      sensor.offC = Math.cos(off); sensor.offS = Math.sin(off);
    } else {
      if (Math.cos(off - Math.atan2(sensor.offS, sensor.offC)) < 0) off += Math.PI;
      sensor.offC += (Math.cos(off) - sensor.offC) * 0.05; sensor.offS += (Math.sin(off) - sensor.offS) * 0.05;
    }
    take(e.alpha + Math.atan2(sensor.offS, sensor.offC) * R2D, e.beta, e.gamma);
  } else {
    sensor.noCompass = !e.absolute;
    take(e.alpha, e.beta, e.gamma);
  }
}
let wake = null;
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) wake = await navigator.wakeLock.request('screen');
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch {}
}
const blocked = () => toast("This page can't read the motion sensors here. Open it from its own web address to use the compass.");
// quiet: started by the page itself, not a tap, so it asks for nothing and gives up without a word if no readings come
async function compassOn(quiet = false) {
  if (sensor.active) return;
  if (!quiet && typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    let res;
    try { res = await DeviceOrientationEvent.requestPermission(); } catch { blocked(); return; }
    if (res !== 'granted') { toast('Motion access was turned down. Close and reopen the page to be asked again.'); return; }
  }
  window.addEventListener('deviceorientationabsolute', onAbsolute);
  window.addEventListener('deviceorientation', onRelative);
  Object.assign(sensor, { active: true, seen: false, abs: false, offC: null, noCompass: false });
  syncCompass();
  keepAwake(true);
  setTimeout(() => {
    if (!sensor.active) return;
    if (!sensor.seen) { compassOff(); if (quiet) armCompass(); else blocked(); }
    else if (sensor.noCompass) toast('No compass reading on this device. Drag sideways to line the sky up with a bright star.');
  }, 2500);
}
function compassOff() {
  window.removeEventListener('deviceorientationabsolute', onAbsolute);
  window.removeEventListener('deviceorientation', onRelative);
  sensor.active = false;
  Object.assign(view, viewFromCamera());
  view.alt = clamp(view.alt, -20, 89.5);
  applyView();
  syncCompass();
  keepAwake(false);
}
function syncCompass() {
  const b = $('compass');
  b.setAttribute('aria-pressed', String(sensor.active));
  $('compass-text').textContent = sensor.active ? 'Compass on' : 'Compass';
}
document.addEventListener('visibilitychange', () => { if (sensor.active && document.visibilityState === 'visible') keepAwake(true); });

// drag to look (or, with the compass on, to nudge the alignment); pinch or scroll to zoom; tap to pick
const pointers = new Map();
let gesture = null;
const canvas = renderer.domElement;
const spread = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) gesture = { x: e.clientX, y: e.clientY, t: performance.now(), moved: false };
  else if (pointers.size === 2) gesture = { pinch: spread(), fov: camera.fov, moved: true };
  hideHint();
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2 && gesture?.pinch) {
    camera.fov = clamp(gesture.fov * gesture.pinch / spread(), 20, 100);
    camera.updateProjectionMatrix();
    dirty = true;
    return;
  }
  if (gesture && Math.hypot(e.clientX - gesture.x, e.clientY - gesture.y) > 6) gesture.moved = true;
  if (!gesture?.moved) return;
  const degPerPx = camera.fov / canvas.clientHeight;
  if (sensor.active) calib += dx * degPerPx;
  else {
    view.az = mod(view.az - dx * degPerPx, 360);
    view.alt = clamp(view.alt + dy * degPerPx, -20, 89.5);
    applyView();
  }
  dirty = true;
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (gesture && !gesture.moved && performance.now() - gesture.t < 500) tap(e.clientX, e.clientY);
    if (sensor.active) { try { localStorage.setItem('planet-sky-nudge', String(calib)); } catch {} }
    gesture = null;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camera.fov = clamp(camera.fov * Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.001)), 20, 100);
  camera.updateProjectionMatrix();
  dirty = true;
}, { passive: false });
const proj = new THREE.Vector3();
function tap(x, y) {
  const b = canvas.getBoundingClientRect();
  let best = null, bd = 32;
  for (const o of PLANETS) {
    proj.copy(o.pos).project(camera);
    if (proj.z > 1) continue;
    const dd = Math.hypot((proj.x + 1) / 2 * b.width - (x - b.left), (1 - proj.y) / 2 * b.height - (y - b.top));
    if (dd < bd) { bd = dd; best = o; }
  }
  if (best !== state.sel) select(best);
}

// ---------- controls ----------
dateIn.addEventListener('input', () => { state.live = false; setNight(+dateIn.value); updateSky(); });
timeIn.addEventListener('input', () => { state.live = false; state.minutes = +timeIn.value; updateSky(); });
nowBtn.addEventListener('click', goLive);
// the arrows: a night at a time on the date, a minute at a time on the clock, running on through midnight-to-noon
// and past the ends of the date slider (which re-centres on the night reached)
function stepNight(n) {
  state.live = false;
  if (state.k + n < 0 || state.k + n > 365) { state.base = state.noon; state.k = HALF; }
  setNight(state.k + n);
}
function stepMinute(n) {
  state.live = false;
  let m = state.minutes + n;
  if (m < 0) { stepNight(-1); m += state.nightMin; }
  else if (m > state.nightMin) { m -= state.nightMin; stepNight(1); }
  state.minutes = m;
  timeIn.value = String(m);
}
// press and hold to keep going; held minutes speed up to five at a time
for (const b of document.querySelectorAll('.arrow')) {
  const by = +b.dataset.by, night = b.dataset.step === 'night';
  let timer = 0, n = 0;
  const go = () => { night ? stepNight(by) : stepMinute(by * (n > 20 ? 5 : 1)); n++; updateSky(); };
  const stop = () => { clearTimeout(timer); timer = 0; n = 0; };
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    b.setPointerCapture(e.pointerId);
    go();
    const again = () => { go(); timer = setTimeout(again, night ? 110 : 70); };
    timer = setTimeout(again, 400);
  });
  for (const t of ['pointerup', 'pointercancel', 'lostpointercapture']) b.addEventListener(t, stop);
  b.addEventListener('click', e => { if (e.detail === 0) go(); }); // keyboard
  b.addEventListener('contextmenu', e => e.preventDefault());
}
$('card-close').addEventListener('click', () => select(null));
$('card-go').addEventListener('click', () => {
  if (!state.best) return;
  state.live = false;
  state.minutes = Math.round((state.best.ms - state.noon) / 6e4);
  timeIn.value = String(state.minutes);
  updateSky();
});
pointing.addEventListener('click', () => {
  if (!sensor.active || Math.round(calib) === 0) return;
  calib = 0;
  try { localStorage.removeItem('planet-sky-nudge'); } catch {}
  toast('Alignment nudge cleared.');
});
const touch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
// On a phone the sky is held in its true position from the start: the compass sets the direction and the tilt sensors
// the height. Where the browser wants a tap before it shares them (iPhones), the calendar's Sky button has usually
// asked already; failing that, the first touch on the sky asks. Turning the compass off is remembered.
let wantCompass = true;
try { wantCompass = localStorage.getItem('planet-sky-compass') !== '0'; } catch {}
const rememberCompass = on => { wantCompass = on; try { localStorage.setItem('planet-sky-compass', on ? '1' : '0'); } catch {} };
function armCompass() {
  if (!wantCompass || typeof DeviceOrientationEvent.requestPermission !== 'function') return;
  canvas.addEventListener('pointerup', () => { if (wantCompass && !sensor.active) compassOn(); }, { once: true });
}
if (touch && typeof DeviceOrientationEvent !== 'undefined') {
  $('compass').hidden = false;
  $('compass').addEventListener('click', () => { rememberCompass(!sensor.active); sensor.active ? compassOff() : compassOn(); });
  if (wantCompass) compassOn(true);
}
let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
}
const hint = $('hint');
hint.textContent = touch ? 'Hold your phone up to the sky. With the compass off, drag to look around. Tap a planet for its path tonight.'
  : 'Drag to look around · scroll to zoom · click a planet for its path tonight';
function hideHint() { hint.style.opacity = '0'; }
setTimeout(hideHint, 9000);

let lastPointing = '';
function updatePointing() {
  const v = viewFromCamera();
  const nudged = sensor.active && Math.round(calib) !== 0;
  let t = `${compass(v.az)} ${Math.round(v.az)}° · ${Math.round(v.alt)}° up`;
  if (nudged) t += ` · nudged ${calib > 0 ? '+' : ''}${Math.round(calib)}°`;
  if (t === lastPointing) return;
  lastPointing = t;
  pointing.textContent = t;
  pointing.classList.toggle('nudged', nudged);
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  css.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  scene.traverse(o => { if (o.material?.isLineMaterial) o.material.resolution.set(w, h); });
  drawSpark();
  dirty = true;
}
new ResizeObserver(resize).observe(host);
resize();

let announced = false;
function frame() {
  requestAnimationFrame(frame);
  if (sensor.active && sensor.seen) {
    const orient = (screen.orientation?.angle ?? window.orientation ?? 0) * D2R;
    deviceQuat(qT, (sensor.alpha + calib) * D2R, sensor.beta * D2R, sensor.gamma * D2R, orient);
    camera.quaternion.slerp(qT, 0.2);
    dirty = true;
  }
  if (!dirty) return;
  dirty = false;
  renderer.render(scene, camera);
  css.render(scene, camera);
  updatePointing();
  if (EMBED && !announced) { announced = true; window.parent.postMessage({ type: 'sky-ready' }, '*'); }
}

// ---------- arriving from, and going back to, the calendar ----------
const back = $('back');
if (location.protocol === 'file:') back.href = 'index.html';
const goBack = () => window.parent.postMessage({ type: 'sky-back', t: instant(), obj: state.sel ? state.sel.id : null, ...viewFromCamera(), fov: camera.fov }, '*');
if (EMBED) {
  back.addEventListener('click', e => { e.preventDefault(); goBack(); });
  window.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
}
if (Number.isFinite(+Q.get('az')) && Q.has('az')) view.az = mod(+Q.get('az'), 360);
if (Number.isFinite(+Q.get('alt')) && Q.has('alt')) view.alt = clamp(+Q.get('alt'), -10, 85);
applyView();
if (+Q.get('t') > 0) goTo(+Q.get('t')); else goLive();
if (Q.get('obj')) { const o = PLANETS.find(p => p.id === Q.get('obj')); if (o) select(o); }
setInterval(() => { if (state.live) goLive(); }, 15000);
requestAnimationFrame(frame);
</script>
</body>
</html>
